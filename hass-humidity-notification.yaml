# Version: 1.1.0
blueprint:
  name: Humidity threshold detection & notification for all humidity sensors
  description: >
    Regularly test all sensors with 'humidity' device-class for crossing
    a certain humidity level threshold and if so execute an action.
    Version 1.1.0 - Uses entity_name(), device_name() and area_name() for
    full context in notifications (Area › Device › Entity).
  domain: automation
  source_url: https://github.com/FlySmack/hass-humidity-notification/blob/main/hass-humidity-notification.yaml
  input:
    threshold:
      name: Humidity warning level threshold
      description: Humidity sensors above threshold are assumed to be high humidity.
      default: 65
      selector:
        number:
          min: 5.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 5.0
    update_frequency:
      name: Update frequency every XX minutes
      description: Update frequency every xx minutes. Value must be provided with leading '/' and cannot be higher then 59.
      default: "/15"
      selector:
        text:
    exclude:
      name: Excluded Sensors
      description: Humidity sensors (e.g. smartphone) to exclude from detection. Only entities are supported, devices must be expanded!
      default:
        entity_id: []
      selector:
        target:
          entity:
          - device_class:
            - humidity
    user_conditions:
      name: (Optional) Additional Condition(s)
      description: In case of additional conditions must be met, they can be defined here
      default: []
      selector:
        condition: {}
    actions:
      name: Actions
      description: Notifications or similar to be run. {{sensors}} is replaced with
        the names of sensors are above humidity threshold.
      selector:
        action: {}
variables:
  threshold: !input threshold
  exclude: !input exclude
  sensors: >
    {% set result = namespace(sensors=[]) %}
    {% for state in states.sensor | selectattr('attributes.device_class', '==', 'humidity') %}
        {% if 0 <= state.state | int(-1) > threshold | int and not state.entity_id in exclude.entity_id %}
            {% set area = area_name(state.entity_id) %}
            {% set device = device_name(state.entity_id) %}
            {% set entity = entity_name(state.entity_id) %}
            {% set parts = ([area] if area else []) + ([device] if device and device != entity else []) + [entity] %}
            {% set result.sensors = result.sensors + [parts | join(' › ') ~ ' (' ~ state.state ~ ' %)'] %}
        {% endif %}
    {% endfor %}
    {% for state in states.binary_sensor | selectattr('attributes.device_class', '==', 'humidity') | selectattr('state', '==', 'on') %}
        {% if not state.entity_id in exclude.entity_id %}
            {% set area = area_name(state.entity_id) %}
            {% set device = device_name(state.entity_id) %}
            {% set entity = entity_name(state.entity_id) %}
            {% set parts = ([area] if area else []) + ([device] if device and device != entity else []) + [entity] %}
            {% set result.sensors = result.sensors + [parts | join(' › ')] %}
        {% endif %}
    {% endfor %}
    {{result.sensors|join(', ')}}
trigger:
  - platform: time_pattern
    id: temp_update
    minutes: !input update_frequency
condition:
  - '{{ sensors != '''' }}'
action:
- choose:
  - conditions: !input user_conditions
    sequence: !input actions
mode: single
