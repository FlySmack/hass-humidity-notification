# Version: 1.3.4
blueprint:
  name: Humidity threshold detection & notification for all humidity sensors
  description: >
    Regularly test all sensors with 'humidity' device-class for crossing
    a certain humidity level threshold and if so execute an action.
    Version 1.3.4 - Fix: coerce all single-string target IDs to list before
    iterating (HA allows single ID or list for every target key).
    Area › Device › Entity context in notifications.
  domain: automation
  source_url: https://github.com/FlySmack/hass-humidity-notification/blob/main/hass-humidity-notification.yaml
  homeassistant:
    min_version: "2024.6.0"
  input:
    threshold:
      name: Humidity warning level threshold
      description: Humidity sensors above threshold are assumed to be high humidity.
      default: 65
      selector:
        number:
          min: 5.0
          max: 100.0
          unit_of_measurement: '%'
          mode: slider
          step: 5.0
    update_frequency:
      name: Update frequency every XX minutes
      description: Update frequency every xx minutes. Value must be provided with leading '/' and cannot be higher then 59.
      default: "/15"
      selector:
        text:
    exclude:
      name: Excluded Sensors
      description: >
        Humidity sensors to exclude from detection. Supports individual entities,
        devices, areas, floors and labels — use the full target selector.
      default: {}
      selector:
        target:
          entity:
            - device_class:
              - humidity
    user_conditions:
      name: (Optional) Additional Condition(s)
      description: In case of additional conditions must be met, they can be defined here
      default: []
      selector:
        condition: {}
    actions:
      name: Actions
      description: Notifications or similar to be run. {{sensors}} is replaced with
        the names of sensors are above humidity threshold.
      selector:
        action: {}
variables:
  threshold: !input threshold
  exclude: !input exclude
  excluded_ids: >
    {% set _ei  = exclude.entity_id  if exclude.entity_id  is defined else [] %}
    {% set _di  = exclude.device_id  if exclude.device_id  is defined else [] %}
    {% set _ai  = exclude.area_id    if exclude.area_id    is defined else [] %}
    {% set _fi  = exclude.floor_id   if exclude.floor_id   is defined else [] %}
    {% set _li  = exclude.label_id   if exclude.label_id   is defined else [] %}
    {% set excl_entities = [_ei] if _ei is string else _ei %}
    {% set excl_devices  = [_di] if _di is string else _di %}
    {% set excl_areas    = [_ai] if _ai is string else _ai %}
    {% set excl_floors   = [_fi] if _fi is string else _fi %}
    {% set excl_labels   = [_li] if _li is string else _li %}
    {% set excl_sub      = exclude.exclude if exclude.exclude is defined else {} %}
    {% set _nei = excl_sub.entity_id if excl_sub.entity_id is defined else [] %}
    {% set _ndi = excl_sub.device_id if excl_sub.device_id is defined else [] %}
    {% set _nai = excl_sub.area_id   if excl_sub.area_id   is defined else [] %}
    {% set _nfi = excl_sub.floor_id  if excl_sub.floor_id  is defined else [] %}
    {% set _nli = excl_sub.label_id  if excl_sub.label_id  is defined else [] %}
    {% set not_entities  = [_nei] if _nei is string else _nei %}
    {% set not_devices   = [_ndi] if _ndi is string else _ndi %}
    {% set not_areas     = [_nai] if _nai is string else _nai %}
    {% set not_floors    = [_nfi] if _nfi is string else _nfi %}
    {% set not_labels    = [_nli] if _nli is string else _nli %}
    {% set ns = namespace(ids=[], not_ids=[]) %}
    {% for eid in excl_entities %}
      {% set ns.ids = ns.ids + [eid] %}
    {% endfor %}
    {% for did in excl_devices %}
      {% for eid in device_entities(did) %}
        {% set ns.ids = ns.ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for aid in excl_areas %}
      {% for eid in area_entities(aid) %}
        {% set ns.ids = ns.ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for fid in excl_floors %}
      {% for aid in floor_areas(fid) %}
        {% for eid in area_entities(aid) %}
          {% set ns.ids = ns.ids + [eid] %}
        {% endfor %}
      {% endfor %}
    {% endfor %}
    {% for lid in excl_labels %}
      {% for eid in label_entities(lid) %}
        {% set ns.ids = ns.ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for eid in not_entities %}
      {% set ns.not_ids = ns.not_ids + [eid] %}
    {% endfor %}
    {% for did in not_devices %}
      {% for eid in device_entities(did) %}
        {% set ns.not_ids = ns.not_ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for aid in not_areas %}
      {% for eid in area_entities(aid) %}
        {% set ns.not_ids = ns.not_ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {% for fid in not_floors %}
      {% for aid in floor_areas(fid) %}
        {% for eid in area_entities(aid) %}
          {% set ns.not_ids = ns.not_ids + [eid] %}
        {% endfor %}
      {% endfor %}
    {% endfor %}
    {% for lid in not_labels %}
      {% for eid in label_entities(lid) %}
        {% set ns.not_ids = ns.not_ids + [eid] %}
      {% endfor %}
    {% endfor %}
    {{ ns.ids | unique | reject('in', ns.not_ids) | list | to_json }}
  sensors: >
    {% set excl = excluded_ids | trim | from_json %}
    {% set result = namespace(sensors=[]) %}
    {% for state in states.sensor | selectattr('attributes.device_class', '==', 'humidity') %}
        {% if state.state | int(-1) >= 0 and state.state | int > threshold | int and not state.entity_id in excl %}
            {% set area = area_name(state.entity_id) %}
            {% set device = device_name(state.entity_id) %}
            {% set entity = entity_name(state.entity_id) %}
            {% set parts = ([area] if area else []) + ([device] if device and device != entity else []) + [entity] %}
            {% set result.sensors = result.sensors + [parts | join(' › ') ~ ' (' ~ state.state ~ ' %)'] %}
        {% endif %}
    {% endfor %}
    {% for state in states.binary_sensor | selectattr('attributes.device_class', '==', 'humidity') | selectattr('state', '==', 'on') %}
        {% if not state.entity_id in excl %}
            {% set area = area_name(state.entity_id) %}
            {% set device = device_name(state.entity_id) %}
            {% set entity = entity_name(state.entity_id) %}
            {% set parts = ([area] if area else []) + ([device] if device and device != entity else []) + [entity] %}
            {% set result.sensors = result.sensors + [parts | join(' › ')] %}
        {% endif %}
    {% endfor %}
    {{result.sensors|join(', ')}}
trigger:
  - platform: time_pattern
    id: temp_update
    minutes: !input update_frequency
condition:
  - '{{ sensors != '''' }}'
action:
- choose:
  - conditions: !input user_conditions
    sequence: !input actions
mode: single
